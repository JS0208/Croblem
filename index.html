<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문제 모음</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1 class="page-title">크로아톤 미니 문제 모음</h1>
        <p class="page-subtitle">텍스트에 집중하는 미니멀 문제방</p>
        <p class="page-note">
          AI는 활용은 양심적으로 지양해 주시고, 정답 제출은 스스로 풀어낸 흔적과 함께
          부탁드립니다.
        </p>
        <div class="page-actions">
          <a
            id="open-profile-link"
            class="button button-primary"
            href="#"
            target="_blank"
            rel="noopener"
          >
            오픈 프로필로 제출하기
          </a>
        </div>
      </header>
      <section class="ranking" aria-label="정답자 랭킹">
        <div class="ranking-header">
          <div>
            <h2 class="ranking-title">정답자 랭킹</h2>
            <p class="ranking-subtitle">가장 많이 푼 사람</p>
          </div>
          <div class="ranking-actions">
            <span id="ranking-total" class="ranking-total"></span>
            <button
              id="ranking-toggle"
              class="button button-secondary ranking-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="ranking-panel"
            >
              랭킹 펼치기
            </button>
          </div>
        </div>
        <div id="ranking-panel" class="ranking-panel" aria-hidden="true">
          <div class="ranking-panel-inner">
            <div id="ranking-list" class="ranking-list"></div>
          </div>
        </div>
      </section>
      <section id="problem-list" class="problem-list" aria-live="polite"></section>
    </main>
  </body>
</html>
